# Define upstream servers
upstream german-law-web {
    server german-law-web:3000;
}

upstream german-law-server {
    server german-law-server:3000;
}

server {
    listen 80;
    server_name localhost;

    # Route requests to the main frontend
    location / {
        proxy_pass http://german-law-web;
    }

    # Redirect requests to /meinjustus to german-law-server's API
    location /meinjustus {
        rewrite ^/meinjustus/(.*) /$1 break;
        proxy_pass http://german-law-server/api/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
