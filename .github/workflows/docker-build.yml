name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Image to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - api-gateway
          - model-service
          - frontend
          - nginx

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mern-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, model-service, frontend, nginx]
    steps:
      - name: Checkout repository
        if: inputs.service == 'all' || inputs.service == matrix.service
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: inputs.service == 'all' || inputs.service == matrix.service
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: inputs.service == 'all' || inputs.service == matrix.service
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push ${{ matrix.service }} image
        if: inputs.service == 'all' || inputs.service == matrix.service
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
            NEXT_PUBLIC_STRIPE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_KEY }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
